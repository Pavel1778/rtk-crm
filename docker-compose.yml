services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: rtk_keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - rtk_network

  redis:
    image: redis:7-alpine
    container_name: rtk_redis
    restart: always
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - rtk_network

  minio:
    image: minio/minio:latest
    container_name: rtk_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rtk_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rtk_network

  minio-init:
    image: minio/mc:latest
    container_name: rtk_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      mc anonymous set none local/$${S3_BUCKET} &&
      echo 'MinIO bucket ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rtk_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: ${S3_BUCKET:-rtk-crm}
    networks:
      - rtk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtk_backend
    restart: always
    working_dir: /
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: "redis://redis:6379/0"
      S3_ENDPOINT: "minio:9000"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rtk_minio}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: ${S3_BUCKET:-rtk-crm}
      S3_SECURE: "false"
      KEYCLOAK_URL: "http://keycloak:8080"
      PYTHONPATH: "/"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1}"
    depends_on:
      - redis
      - minio
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - rtk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
    container_name: rtk_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rtk_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rtk_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/static:/app/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rtk_network

volumes:
  minio_data:

networks:
  rtk_network:
    driver: bridge