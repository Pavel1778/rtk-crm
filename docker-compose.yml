services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: rtk_keycloak
    restart: always
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD must be set}
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - rtk_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rtk_backend
    restart: always
    working_dir: /
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      REDIS_URL: "redis://redis:6379/0"
      KEYCLOAK_URL: "http://keycloak:8080"
      PYTHONPATH: "/"
      CORS_ORIGINS: "http://localhost:3000,http://localhost,http://127.0.0.1:3000"
    networks:
      - rtk_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8080
    container_name: rtk_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rtk_network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: rtk_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./backend/static:/app/static:ro
    depends_on:
      - backend
      - frontend
    networks:
      - rtk_network

networks:
  rtk_network:
    driver: bridge