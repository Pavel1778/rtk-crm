# Прод-конфигурация для Yandex Cloud: PostgreSQL, KeyDB, backend, frontend, nginx.
# Запуск: docker compose -f infra/yandex-cloud/docker-compose.prod.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: rtk_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rtk_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtk_user} -d ${POSTGRES_DB:-rtk_crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rtk_network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: rtk_backend
    restart: always
    working_dir: /
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      # Канонический конфиг колонок отчёта — общий для бэкенда и фронтенда.
      - ../../config:/config:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rtk_user:${POSTGRES_PASSWORD}@postgres:5432/rtk_crm}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      # production включает валидацию SECRET_KEY при старте: приложение не
      # поднимется со слабым или дефолтным ключом.
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rtk-crm.ru}
      # true обязателен для демо: без него база пустая и войти некуда.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      MOCK_MODE: ${MOCK_MODE:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-rtk-crm}
      S3_SECURE: ${S3_SECURE:-false}
      PYTHONPATH: "/"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rtk_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Пустая строка = запросы идут на origin страницы (same-origin), а
        # nginx проксирует /api/ на backend. Абсолютный URL здесь означал бы
        # обращение в обход nginx и CORS-отказ в браузере.
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: rtk_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - rtk_network

  nginx:
    image: nginx:1.27-alpine
    container_name: rtk_nginx
    restart: always
    entrypoint: ["/etc/nginx/nginx-entrypoint.sh"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TLS_ENABLED: ${TLS_ENABLED:-false}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-entrypoint.sh:/etc/nginx/nginx-entrypoint.sh:ro
      - ./nginx-http.conf.template:/etc/nginx/templates/nginx-http.conf.template:ro
      - ./nginx-tls.conf.template:/etc/nginx/templates/nginx-tls.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - rtk_network

volumes:
  postgres_data:
  certbot_webroot:

networks:
  rtk_network:
    driver: bridge
