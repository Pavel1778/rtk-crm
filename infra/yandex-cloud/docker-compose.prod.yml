# Прод-конфигурация для Yandex Cloud: собственный PostgreSQL вместо Supabase.
# Запуск: docker compose -f infra/yandex-cloud/docker-compose.prod.yml --env-file .env up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: rtk_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rtk_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-rtk_crm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rtk_user} -d ${POSTGRES_DB:-rtk_crm}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rtk_network

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: rtk_backend
    restart: always
    working_dir: /
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      # Канонический конфиг колонок отчёта — общий для бэкенда и фронтенда.
      - ../../config:/config:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rtk_user:${POSTGRES_PASSWORD}@postgres:5432/rtk_crm}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://rtk-crm.ru}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      PYTHONPATH: "/"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rtk_network

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://rtk-crm.ru}
    container_name: rtk_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - rtk_network

  nginx:
    image: nginx:1.27-alpine
    container_name: rtk_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - rtk_network

volumes:
  postgres_data:
  certbot_webroot:

networks:
  rtk_network:
    driver: bridge
