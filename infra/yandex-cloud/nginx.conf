# Reverse-proxy для RTK CRM в Yandex Cloud.
# Монтируется в контейнер nginx как /etc/nginx/conf.d/default.conf.

upstream rtk_backend {
    server backend:8000;
}

upstream rtk_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name rtk-crm.ru www.rtk-crm.ru;

    # Проверка домена Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name rtk-crm.ru www.rtk-crm.ru;

    ssl_certificate /etc/letsencrypt/live/rtk-crm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rtk-crm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/ {
        proxy_pass http://rtk_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://rtk_backend/health;
    }

    # Кэш статики фронтенда
    location ~* \.(js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        proxy_pass http://rtk_frontend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://rtk_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
