server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Backend API. Проксирование на backend:8000 делает фронтенд
    # same-origin: браузер обращается к /api на том же хосте и порту, что и
    # страница. Поэтому VITE_API_URL можно оставить пустым, и стенд работает
    # по любому адресу (localhost, IP ВМ, домен) без правки CORS_ORIGINS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }

    # Загруженные файлы и статика backend.
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }

    # SPA-роутинг: любые пути → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кэш статики
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2|woff|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # health
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}